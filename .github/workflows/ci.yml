name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  unit-data:
    needs: lint-workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and data tests
        run: npm run test:data

  build:
    needs: unit-data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release artifact
        run: npm run build:site

      # This artifact becomes deployable only after the entire CI run succeeds.
      - name: Upload static site
        uses: actions/upload-artifact@v6
        with:
          name: public-site
          path: dist/
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Download shared static site
        uses: actions/download-artifact@v8
        with:
          name: public-site
          path: dist

      - name: Run browser tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          STATIC_SITE_ROOT: dist

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Keep the existing test check name and reject failed, cancelled or skipped jobs.
  test:
    needs: [lint-workflows, unit-data, build, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all CI checks to succeed
        env:
          LINT_RESULT: ${{ needs.lint-workflows.result }}
          UNIT_RESULT: ${{ needs.unit-data.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success
