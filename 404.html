<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません</title>
  <style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}body{margin:0;padding:40px 20px;background:#f6f1ea;color:#251f1a}main{max-width:700px;margin:auto}h1{font-size:clamp(1.5rem,5vw,2.2rem)}a{color:#8b4333;text-underline-offset:3px}@media(prefers-color-scheme:dark){body{background:#171412;color:#f3ede6}a{color:#d47b65}}</style>
</head>
<body>
  <main>
    <h1>ページが見つかりません</h1>
    <p>リンクが古い可能性があります。URLを確認するか、トップページへ戻ってください。</p>
    <p><a id="homeLink" href="/">幕末人物・勢力ナビへ戻る</a></p>
  </main>
  <script>
  (() => {
    'use strict';
    async function findHome() {
      const link = document.querySelector('#homeLink');
      const segments = window.location.pathname.split('/').filter(Boolean);
      for (let length = segments.length - 1; length >= 0; length -= 1) {
        const base = `/${segments.slice(0, length).join('/')}${length ? '/' : ''}`;
        try {
          const response = await fetch(`${base}index.html`, { method: 'HEAD', cache: 'no-store' });
          if (response.ok) {
            link.href = base || '/';
            return;
          }
        } catch {
          // Keep trying parent paths; the root link remains as a fallback.
        }
      }
    }
    findHome();
  })();
  </script>
</body>
</html>
